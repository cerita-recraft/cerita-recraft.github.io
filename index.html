<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ReCraft · Setiap Kain Punya Cerita</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: hangat, buatan tangan, ramah, seperti toko kerajinan lokal yang rapi
   IDEA: kain perca yang dijahit: jahitan putus-putus, tambalan warna, label kain, bayangan geser
   PICTURE: foto kemeja lama yang berubah jadi tote bag dari kain yang sama, label SEBELUM / SESUDAH
   COLOUR and TYPE: dasar krem hangat, tinta ungu tua, enam warna perca ReCraft; Plus Jakarta Sans
   LAYOUT: situs utuh (header sampai footer), alur langkah satu kolom di HP, ruang kerja bersidebar */
:root{color-scheme:light;
--pink:#F4A6C1;--purple:#B8A5E5;--blue:#9CCAF2;--tq:#68D3CE;--orange:#F5A15B;--yellow:#F5D76E;
--cream:#FFF9F2;--white:#fff;--dark:#302D3D;
--s-pink:#FDE9F1;--s-purple:#F0ECFB;--s-blue:#E7F2FC;--s-tq:#E0F6F5;--s-orange:#FEEEDF;--s-yellow:#FDF6D6;
--i-pink:#B23F72;--i-purple:#6650B0;--i-blue:#2A69A6;--i-tq:#137A74;--i-orange:#A9520F;--i-yellow:#7D6005;
--muted:#6B6780;--border:#E4D6C4;--line:#EFE3D3;--err:#C93C3C;--err-s:#FCEAEA;--ok:#23865A;
--r-s:10px;--r-m:16px;--r-l:24px;--r-xl:32px;--off:4px 4px 0 var(--dark)}
:root[data-theme=dark],:root[data-theme=light]{color-scheme:light}
*{box-sizing:border-box;min-width:0}
html{scroll-padding-top:110px;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--cream);color:var(--dark);font:16px/1.55 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:clip}
img{display:block;max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--i-purple)}
h1,h2,h3,h4{margin:0;line-height:1.12;text-wrap:balance;letter-spacing:-.02em}
p{margin:0}
.display{font-size:clamp(38px,6vw,64px);font-weight:800;letter-spacing:-.035em;line-height:1.04}
.h1{font-size:clamp(30px,4.4vw,46px);font-weight:800}
.h2{font-size:clamp(26px,3.4vw,36px);font-weight:700}
.h3{font-size:clamp(20px,2.4vw,24px);font-weight:700}
.h4{font-size:19px;font-weight:700;letter-spacing:-.01em}
.lead{font-size:18px}
.sm{font-size:14px}.tiny{font-size:13px}
.muted{color:var(--muted)}
.b{font-weight:700}
.kick{font-size:14px;font-weight:700;margin-bottom:10px}
.c-tq{color:var(--i-tq)}.c-pink{color:var(--i-pink)}.c-purple{color:var(--i-purple)}.c-blue{color:var(--i-blue)}.c-orange{color:var(--i-orange)}.c-yellow{color:var(--i-yellow)}
.ic{flex:none;vertical-align:middle}
.wrap{max-width:1240px;margin:0 auto;padding-inline:max(4vw,16px)}
.row{display:flex;align-items:center;gap:10px}
.wr{flex-wrap:wrap}.sb{justify-content:space-between}.end{align-items:flex-end}.top-a{align-items:flex-start}
.col{display:flex;flex-direction:column;gap:12px}
.g8{gap:8px}.g12{gap:12px}.g16{gap:16px}.g24{gap:24px}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt24{margin-top:24px}.mt32{margin-top:32px}
.grid{display:grid;gap:20px}
.g-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-5{grid-template-columns:repeat(5,minmax(0,1fr))}
.g-auto{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
@media(max-width:1100px){.g-5{grid-template-columns:repeat(3,minmax(0,1fr))}.g-4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:760px){.g-3,.g-5{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:560px){.g-2,.g-3,.g-4,.g-5{grid-template-columns:minmax(0,1fr)}}

/* prototype bar + header */
.proto{background:var(--dark);color:#fff;font-size:13px}
.proto .wrap{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:40px;flex-wrap:wrap;padding-block:4px}
.seg{display:inline-flex;background:#ffffff1a;border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:none;color:#fff;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;cursor:pointer;min-height:30px}
.seg button[aria-pressed=true]{background:var(--yellow);color:var(--dark)}
.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--cream) 92%,transparent);backdrop-filter:blur(8px);border-bottom:2px dashed var(--border)}
.top .wrap{display:flex;align-items:center;gap:20px;min-height:72px}
.logo{display:flex;align-items:center;gap:9px;text-decoration:none;color:var(--dark);font-weight:800;font-size:21px;letter-spacing:-.06em;flex:none;cursor:pointer;background:none;border:0;padding:0}
.mark{width:34px;height:34px;display:grid;grid-template-columns:1fr 1fr;border:2px solid var(--dark);border-radius:10px;overflow:hidden;transform:rotate(-6deg)}
.mark i:nth-child(1){background:var(--pink)}.mark i:nth-child(2){background:var(--yellow)}.mark i:nth-child(3){background:var(--tq)}.mark i:nth-child(4){background:var(--purple)}
.nav{display:flex;gap:4px;flex:1;justify-content:center;flex-wrap:wrap}
.nav a{padding:9px 12px;border-radius:999px;text-decoration:none;color:var(--dark);font-weight:600;font-size:15px;cursor:pointer}
.nav a:hover{background:var(--s-orange)}
.nav a[aria-current=page]{background:var(--white);box-shadow:inset 0 0 0 2px var(--dark)}
.hact{display:flex;gap:8px;align-items:center;margin-left:auto}
.iconbtn{position:relative;width:44px;height:44px;border-radius:50%;border:2px solid var(--dark);background:var(--white);display:grid;place-items:center;cursor:pointer;flex:none}
.dot{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;border-radius:999px;background:var(--pink);border:2px solid var(--dark);font-size:11px;font-weight:800;display:grid;place-items:center;padding:0 4px}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--purple);border:2px solid var(--dark);display:grid;place-items:center;font-weight:800;cursor:pointer;flex:none}
.menubtn{display:none}
.nav .mobile-only{display:none}
@media(max-width:980px){
 .menubtn{display:grid}
 .nav{display:none;position:absolute;left:0;right:0;top:100%;background:var(--cream);flex-direction:column;padding:12px max(4vw,16px) 18px;border-bottom:2px dashed var(--border);gap:2px}
 .top.open .nav{display:flex}
 .nav a{padding:12px 14px}
 .nav .mobile-only{display:block}
 .hact .hide-m{display:none}
}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 22px;border-radius:999px;border:2px solid var(--dark);font-weight:700;font-size:16px;cursor:pointer;text-decoration:none;color:var(--dark);background:var(--white);transition:transform .15s,box-shadow .15s;white-space:nowrap}
.btn:hover{transform:translate(-1px,-1px)}
.btn:focus-visible,.chip:focus-visible,.opt:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.seg button:focus-visible,.iconbtn:focus-visible{outline:3px solid var(--i-purple);outline-offset:2px}
.btn-cta{background:var(--orange);box-shadow:var(--off)}
.btn-cta:hover{box-shadow:6px 6px 0 var(--dark)}
.btn-pri{background:var(--dark);color:#fff}
.btn-sec{background:var(--white)}
.btn-ghost{border-color:transparent;background:transparent}
.btn-ghost:hover{background:var(--s-orange)}
.btn-sm{min-height:40px;padding:0 16px;font-size:14px}
.btn-block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
.linkbtn{background:none;border:0;padding:0;color:var(--i-purple);font-weight:700;cursor:pointer;text-decoration:underline;text-underline-offset:3px}

/* surfaces */
.card{background:var(--white);border:2px solid var(--dark);border-radius:var(--r-l);padding:24px}
.card.soft{border-color:var(--border)}
.card.dash{border:2px dashed var(--border)}
.pad-s{padding:16px}
.band{padding-block:clamp(40px,6vw,80px)}
.sechead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:28px}
.sechead p{max-width:620px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.soft-pink{background:var(--s-pink);color:var(--i-pink)}.soft-purple{background:var(--s-purple);color:var(--i-purple)}.soft-blue{background:var(--s-blue);color:var(--i-blue)}.soft-tq{background:var(--s-tq);color:var(--i-tq)}.soft-orange{background:var(--s-orange);color:var(--i-orange)}.soft-yellow{background:var(--s-yellow);color:var(--i-yellow)}.soft-grey{background:var(--line);color:var(--muted)}
.bg-pink{background:var(--s-pink)}.bg-purple{background:var(--s-purple)}.bg-blue{background:var(--s-blue)}.bg-tq{background:var(--s-tq)}.bg-orange{background:var(--s-orange)}.bg-yellow{background:var(--s-yellow)}
.tile{width:52px;height:52px;border-radius:16px;border:2px solid var(--dark);background:var(--white);display:grid;place-items:center;flex:none}
.quilt{display:flex;height:14px}.quilt i{flex:1}
.hr{border:0;border-top:2px dashed var(--border);margin:18px 0}
.note{font-size:13px;color:var(--muted)}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:48px;align-items:center;padding-block:clamp(36px,6vw,72px)}
.hl{display:inline-block;background:var(--pink);padding:0 14px 4px;border-radius:14px;border:2px dashed var(--dark);transform:rotate(-1.5deg)}
.trust{list-style:none;padding:0;margin:26px 0 0;display:flex;flex-wrap:wrap;gap:10px 20px}
.trust li{display:flex;gap:7px;align-items:center;font-size:14px;color:var(--muted)}
.hero-vis{position:relative;aspect-ratio:1/1;max-width:560px;width:100%;justify-self:center}
.ba{position:absolute;margin:0;border:3px solid var(--dark);border-radius:26px;overflow:hidden;background:var(--white);box-shadow:8px 8px 0 var(--dark)}
.ba img{width:100%;height:100%;object-fit:cover}
.ba-before{width:56%;aspect-ratio:1;left:0;top:4%;transform:rotate(-5deg)}
.ba-after{width:62%;aspect-ratio:1;right:0;bottom:2%;transform:rotate(3deg)}
.balabel{position:absolute;top:12px;left:12px;background:var(--white);border:2px solid var(--dark);border-radius:999px;padding:4px 12px;font-weight:800;font-size:13px}
.balabel.dk{background:var(--dark);color:#fff;left:auto;right:12px}
.ba-mark{position:absolute;left:44%;top:46%;transform:translate(-50%,-50%) rotate(-8deg);background:var(--yellow);border:2px solid var(--dark);border-radius:999px;padding:10px 16px;display:flex;gap:8px;align-items:center;font-weight:800;box-shadow:var(--off);z-index:2;white-space:nowrap}
.patch{position:absolute;border:2px solid var(--dark);border-radius:12px;z-index:0}
.p1{width:70px;height:70px;background:var(--tq);right:8%;top:6%;transform:rotate(12deg)}
.p2{width:46px;height:46px;background:var(--purple);left:6%;bottom:10%;transform:rotate(-14deg);border-radius:50%}
.p3{width:90px;height:28px;background:var(--pink);right:30%;top:0;transform:rotate(-6deg);border-style:dashed}
@media(max-width:900px){.hero{grid-template-columns:minmax(0,1fr);gap:28px}.hero-vis{max-width:460px}}

.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--white);border:2px solid var(--dark);border-radius:var(--r-l);overflow:hidden}
.stats>div{padding:22px 24px;border-right:2px dashed var(--border)}
.stats>div:last-child{border:0}
.stat{font-size:clamp(26px,3vw,32px);font-weight:800;letter-spacing:-.03em}
@media(max-width:700px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.stats>div:nth-child(2){border-right:0}.stats>div:nth-child(-n+2){border-bottom:2px dashed var(--border)}}

.vcard{border:2px solid var(--dark);border-radius:var(--r-l);padding:26px;display:flex;flex-direction:column;gap:12px}
.howbox{background:var(--white);border:2px dashed var(--border);border-radius:var(--r-xl);padding:clamp(24px,4vw,48px)}
.steps6{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px}
.steps6>div{text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.stepnum{width:64px;height:64px;border-radius:50%;border:2px solid var(--dark);display:grid;place-items:center;font-weight:800;font-size:19px;flex:none}
@media(max-width:900px){.steps6{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:520px){.steps6{grid-template-columns:minmax(0,1fr)}.steps6>div{flex-direction:row;text-align:left}.stepnum{width:52px;height:52px}}

/* product cards */
.pcard{background:var(--white);border:2px solid var(--dark);border-radius:var(--r-l);overflow:hidden;display:flex;flex-direction:column;transition:transform .15s,box-shadow .15s}
.pcard:hover{transform:translate(-2px,-2px);box-shadow:var(--off)}
.pimg{aspect-ratio:1/1;background:var(--s-yellow);border-bottom:2px solid var(--dark);overflow:hidden}
.pimg img{width:100%;height:100%;object-fit:cover}
.illbox{width:100%;height:100%;display:grid;place-items:center}
.illbox svg{width:72%;height:72%}
.pbody{padding:18px;display:flex;flex-direction:column;gap:10px;flex:1}
.pbody .btn{margin-top:auto}
.price{font-weight:800;font-size:18px;white-space:nowrap}

.memsec{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:40px;align-items:center;background:var(--s-pink);border:2px solid var(--dark);border-radius:var(--r-xl);padding:clamp(24px,5vw,56px)}
.chain{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chain span{border:2px solid var(--dark);border-radius:14px;padding:8px 13px;font-weight:700;font-size:14px}
@media(max-width:860px){.memsec{grid-template-columns:minmax(0,1fr)}}

.mtag{width:min(100%,250px);margin:0 auto;background:var(--white);border:2px solid var(--dark);border-radius:22px;padding:22px 20px 20px;text-align:center;box-shadow:var(--off);position:relative;transform:rotate(2deg)}
.mtag:before{content:"";position:absolute;inset:7px;border:2px dashed var(--border);border-radius:16px;pointer-events:none}
.mtag-hole{width:18px;height:18px;border-radius:50%;border:2px solid var(--dark);margin:0 auto 10px;background:var(--cream)}
.mtag-brand{font-weight:800;font-size:13px;letter-spacing:-.02em}
.mtag-code{display:flex;justify-content:center;align-items:center;gap:10px;margin:12px 0}
.nfcmark{width:86px;height:86px;border-radius:50%;background:var(--s-purple);border:2px solid var(--dark);display:grid;place-items:center;color:var(--i-purple)}
.mtag-title{font-weight:800;font-size:16px}
.mtag-hint{font-size:12px;color:var(--muted);margin-top:4px}

.finalcta{background:var(--dark);color:#fff;border-radius:var(--r-xl);padding:clamp(40px,6vw,80px) 24px 0;text-align:center;overflow:hidden;display:flex;flex-direction:column;align-items:center;gap:16px}
.finalcta .quilt{width:calc(100% + 48px);margin-top:36px}

/* footer */
.foot{border-top:2px dashed var(--border);margin-top:64px;padding-block:40px 28px}
.foot .grid{grid-template-columns:minmax(0,1.6fr) repeat(3,minmax(0,1fr))}
.foot a{display:block;color:var(--dark);text-decoration:none;padding:4px 0;cursor:pointer}
.foot a:hover{text-decoration:underline}
@media(max-width:760px){.foot .grid{grid-template-columns:repeat(2,minmax(0,1fr))}.foot .grid>div:first-child{grid-column:1/-1}}

/* forms */
.field{display:flex;flex-direction:column;gap:6px}
.field>span,.lbl{font-weight:600;font-size:14px}
.inp,.sel,.ta{width:100%;min-height:48px;border:2px solid var(--border);border-radius:14px;background:var(--white);padding:10px 14px;font-size:16px}
.ta{min-height:110px;resize:vertical}
.inp:focus,.sel:focus,.ta:focus{border-color:var(--dark);outline:none;box-shadow:0 0 0 3px var(--s-purple)}
.inp.bad,.ta.bad{border-color:var(--err);background:var(--err-s)}
.ferr{color:var(--err);font-size:13px;font-weight:600}
.errbox{background:var(--err-s);color:var(--err);border:2px solid var(--err);border-radius:14px;padding:12px 14px;font-weight:600;font-size:14px;display:flex;gap:8px;align-items:flex-start}
.okbox{background:var(--s-tq);color:var(--i-tq);border:2px solid var(--tq);border-radius:14px;padding:12px 14px;font-weight:600;font-size:14px;display:flex;gap:8px;align-items:flex-start}
.check{display:flex;gap:10px;align-items:flex-start;cursor:pointer;font-size:15px}
.check input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--dark);flex:none}
.auth{max-width:480px;margin:40px auto}

/* chips & options */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--border);background:var(--white);border-radius:999px;padding:8px 15px;min-height:44px;font-weight:600;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip:hover{border-color:var(--dark)}
.chip[aria-pressed=true]{border-color:var(--dark);background:var(--s-orange);box-shadow:3px 3px 0 var(--dark)}
.chip small{color:var(--muted);font-weight:600}
.opt{border:2px solid var(--border);background:var(--white);border-radius:var(--r-l);padding:18px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:8px;position:relative;width:100%}
.opt:hover{border-color:var(--dark)}
.opt[aria-pressed=true]{border-color:var(--dark);box-shadow:var(--off);background:var(--s-yellow)}
.opt[aria-pressed=true]:after{content:"✓";position:absolute;top:12px;right:12px;width:28px;height:28px;border-radius:50%;background:var(--dark);color:#fff;display:grid;place-items:center;font-weight:800;font-size:14px}
.opt[disabled]{opacity:.5;cursor:not-allowed}
.sw{width:40px;height:40px;border-radius:50%;border:2px solid var(--border);cursor:pointer;padding:0}
.sw[aria-pressed=true]{border:3px solid var(--dark);box-shadow:0 0 0 3px var(--white),0 0 0 5px var(--dark)}

/* flow */
.flowhead{padding-top:28px}
.stepper{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 12px;scrollbar-width:thin}
.st{flex:none;display:flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border-radius:999px;border:2px solid var(--border);background:var(--white);font-size:13px;font-weight:700;color:var(--muted);cursor:default}
.st b{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--line);color:var(--dark);font-size:12px}
.st.done{color:var(--dark);cursor:pointer}.st.done b{background:var(--tq)}
.st.cur{border-color:var(--dark);color:var(--dark);background:var(--s-orange)}.st.cur b{background:var(--orange)}
.flow{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:28px;align-items:start;margin-top:12px}
.flow.full{grid-template-columns:minmax(0,1fr)}
.side{position:sticky;top:96px}
@media(max-width:980px){.flow{grid-template-columns:minmax(0,1fr)}.side{position:static}}
.flownav{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:24px;padding-top:20px;border-top:2px dashed var(--border)}
.sumline{display:flex;justify-content:space-between;gap:12px;font-size:14px;padding:5px 0}
.sumline span:last-child{white-space:nowrap;font-weight:600}
.total{display:flex;justify-content:space-between;gap:12px;font-weight:800;font-size:20px;padding-top:12px;margin-top:8px;border-top:2px dashed var(--border)}
.total span:last-child{white-space:nowrap}

.drop{border:2px dashed var(--dark);border-radius:var(--r-l);background:var(--s-orange);padding:32px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;cursor:pointer;position:relative}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer}
.drop.over{background:var(--s-yellow)}
.thumbs{display:flex;gap:12px;flex-wrap:wrap}
.thumb{width:112px;height:112px;border-radius:16px;border:2px solid var(--dark);overflow:hidden;position:relative;background:var(--white)}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb button{position:absolute;top:6px;right:6px;width:30px;height:30px;border-radius:50%;border:2px solid var(--dark);background:var(--white);display:grid;place-items:center;cursor:pointer;padding:0}
.meter{height:14px;background:var(--line);border-radius:999px;overflow:hidden;border:2px solid var(--dark)}
.meter i{display:block;height:100%;background:var(--tq)}
.fitrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:2px dashed var(--line)}
.fitrow:last-child{border:0}

.stage{position:relative;border:2px solid var(--dark);border-radius:var(--r-l);background:var(--white);overflow:hidden}
.stage-top{aspect-ratio:1/1;position:relative;display:grid;place-items:center;background:radial-gradient(circle at 50% 55%,color-mix(in srgb,var(--acc) 45%,#fff) 0 46%,color-mix(in srgb,var(--acc) 18%,#fff) 46.5%)}
.stage-top:before{content:"";position:absolute;inset:12px;border:2px dashed color-mix(in srgb,var(--acc) 80%,var(--dark));border-radius:18px}
.stage-img{width:78%;aspect-ratio:1;border-radius:22px;overflow:hidden;border:3px solid var(--dark);box-shadow:6px 6px 0 var(--acc);transition:transform .25s;background:var(--white)}
.stage-img img{width:100%;height:100%;object-fit:cover}
.stage-label{position:absolute;bottom:16%;left:50%;transform:translateX(-50%) rotate(-3deg);background:var(--cream);border:2px solid var(--dark);border-radius:6px;padding:4px 12px;font-weight:800;font-size:14px;box-shadow:2px 2px 0 var(--acc);white-space:nowrap;max-width:80%;overflow:hidden;text-overflow:ellipsis}
.stage-from{position:absolute;top:22px;left:22px;display:flex;align-items:center;gap:8px;background:var(--white);border:2px solid var(--dark);border-radius:14px;padding:5px 10px 5px 5px;font-size:12px;font-weight:700}
.stage-from img,.stage-from svg{width:34px;height:34px;border-radius:9px;object-fit:cover;background:var(--s-blue)}
.stage-bot{padding:16px 20px;display:flex;flex-direction:column;gap:10px}

@media(max-width:560px){.dgrid>.side{order:-1}.dgrid .stage{max-width:340px;margin:0 auto}}
.ctrl{padding:16px 0;border-bottom:2px dashed var(--border)}
.ctrl:last-child{border:0}
.ctrl .row{margin-bottom:10px}

.letter{background:#fffdf9;border:2px solid var(--dark);border-radius:var(--r-m);padding:clamp(20px,4vw,40px);font-size:15px;line-height:1.7;box-shadow:var(--off)}
.letter h3{text-align:center;font-size:18px;text-transform:none;margin-bottom:4px}
.letter ol{padding-left:22px;margin:10px 0}
.letter li{margin-bottom:6px}
.letter table{border-collapse:collapse;margin:8px 0 12px}
.letter td{padding:2px 12px 2px 0;vertical-align:top}
.sigpad{position:relative;border:2px dashed var(--dark);border-radius:16px;background:var(--white);height:170px;touch-action:none}
.sigpad canvas{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair;touch-action:none}
.sigpad .hint{position:absolute;bottom:10px;left:0;right:0;text-align:center;font-size:13px;color:var(--muted);pointer-events:none}
.sigtyped{font-family:Caveat,cursive;font-size:42px;line-height:1.1;min-height:60px}
.sigimg{height:70px;width:auto}
.signbox{display:flex;justify-content:flex-end}
.signbox>div{text-align:center;min-width:220px}

/* status */
.badge{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;font-size:12px;font-weight:800;white-space:nowrap}
.badge:before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.ring{width:130px;height:130px;flex:none}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:34px minmax(0,1fr);gap:14px;position:relative;padding-bottom:20px}
.tl li:not(:last-child):before{content:"";position:absolute;left:16px;top:34px;bottom:0;border-left:3px dashed var(--border)}
.tl li.done:not(:last-child):before{border-left:3px solid var(--tq)}
.tl .n{width:34px;height:34px;border-radius:50%;border:2px solid var(--border);background:var(--white);display:grid;place-items:center;color:var(--muted)}
.tl .done .n{background:var(--tq);border-color:var(--dark);color:var(--dark)}
.tl .cur .n{background:var(--orange);border-color:var(--dark);color:var(--dark);box-shadow:0 0 0 5px var(--s-orange)}
.tl .up{color:var(--muted)}
.mini-tl{display:flex;gap:4px}
.mini-tl i{flex:1;height:8px;border-radius:999px;background:var(--line)}
.mini-tl i.on{background:var(--tq)}

/* story slider */
.bas{position:relative;aspect-ratio:4/3;border:2px solid var(--dark);border-radius:var(--r-l);overflow:hidden;--p:50%;background:var(--white)}
.bas>div{position:absolute;inset:0}
.bas>div>img,.bas>div>.illbox{width:100%;height:100%;object-fit:cover}
.bas-after{clip-path:inset(0 0 0 var(--p))}
.bas:after{content:"";position:absolute;top:0;bottom:0;left:var(--p);border-left:3px solid var(--dark);pointer-events:none}
.bas input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:ew-resize;margin:0}
.bas .handle{position:absolute;top:50%;left:var(--p);transform:translate(-50%,-50%);width:46px;height:46px;border-radius:50%;background:var(--yellow);border:2px solid var(--dark);display:grid;place-items:center;pointer-events:none;z-index:2}
.bas .lb{position:absolute;bottom:12px;background:var(--white);border:2px solid var(--dark);border-radius:999px;padding:3px 11px;font-size:12px;font-weight:800;pointer-events:none;z-index:2}

.phone{width:min(100%,360px);margin:0 auto;border:3px solid var(--dark);border-radius:42px;background:var(--white);padding:14px;box-shadow:10px 10px 0 var(--purple)}
.phone-in{border-radius:30px;overflow:hidden;background:var(--cream);border:2px solid var(--line)}

/* workspace */
.ws{display:grid;grid-template-columns:240px minmax(0,1fr);gap:28px;padding-block:28px;align-items:start}
.sidebar{background:var(--white);border:2px solid var(--dark);border-radius:var(--r-l);padding:14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:96px}
.sidebar button{display:flex;align-items:center;gap:10px;border:0;background:none;padding:11px 12px;border-radius:12px;font-weight:600;cursor:pointer;text-align:left;min-height:44px}
.sidebar button:hover{background:var(--s-orange)}
.sidebar button[aria-current=page]{background:var(--dark);color:#fff}
@media(max-width:900px){.ws{grid-template-columns:minmax(0,1fr)}.sidebar{position:static;flex-direction:row;overflow-x:auto}.sidebar button{flex:none}.sidebar .sbl{display:none}}
.kpi{background:var(--white);border:2px solid var(--dark);border-radius:var(--r-l);padding:18px 20px;display:flex;flex-direction:column;gap:6px}
.kanban{display:grid;grid-template-columns:repeat(5,minmax(210px,1fr));gap:14px;overflow-x:auto;padding-bottom:8px;align-items:start}
.kcol{background:var(--white);border:2px dashed var(--border);border-radius:var(--r-l);padding:12px;display:flex;flex-direction:column;gap:10px;min-height:200px}
.kcard{background:var(--cream);border:2px solid var(--dark);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px;cursor:pointer;text-align:left}
.kcard[aria-pressed=true]{box-shadow:var(--off);background:var(--s-yellow)}
.kcard .th{width:44px;height:44px;border-radius:10px;overflow:hidden;border:2px solid var(--dark);flex:none;background:var(--s-blue)}
.kcard .th img,.kcard .th svg{width:100%;height:100%;object-fit:cover}
.tblwrap{overflow-x:auto;border:2px solid var(--dark);border-radius:var(--r-l);background:var(--white)}
table.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:13px;color:var(--muted);font-weight:700;padding:12px 14px;border-bottom:2px solid var(--dark);white-space:nowrap}
.tbl td{padding:12px 14px;border-bottom:2px dashed var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl .num{text-align:right;white-space:nowrap}
.tbl .nw{white-space:nowrap}
.cols{display:flex;align-items:flex-end;gap:10px;height:200px;padding-top:10px}
.cols>div{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.cols i{display:block;width:100%;max-width:44px;border-radius:10px 10px 4px 4px;border:2px solid var(--dark);background:var(--orange)}
.cols span{font-size:12px;color:var(--muted);white-space:nowrap}
.bars>div{display:grid;grid-template-columns:110px minmax(0,1fr) 44px;gap:10px;align-items:center;padding:7px 0;font-size:14px}
.bars i{display:block;height:16px;border-radius:999px;border:2px solid var(--dark)}
.switch{position:relative;width:48px;height:28px;flex:none}
.switch input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:1}
.switch span{position:absolute;inset:0;border-radius:999px;background:var(--line);border:2px solid var(--dark);transition:.15s}
.switch span:after{content:"";position:absolute;width:18px;height:18px;border-radius:50%;background:var(--white);border:2px solid var(--dark);top:3px;left:3px;transition:.15s}
.switch input:checked+span{background:var(--tq)}
.switch input:checked+span:after{left:23px}
.switch input:focus-visible+span{outline:3px solid var(--i-purple);outline-offset:2px}

/* misc */
.empty{text-align:center;padding:48px 20px;display:flex;flex-direction:column;align-items:center;gap:12px}
.empty .tile{width:72px;height:72px;border-radius:22px}
.notif{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:14px;align-items:center;padding:16px;border-radius:18px;border:2px solid var(--border);background:var(--white);cursor:pointer;text-align:left;width:100%}
.notif.unread{border-color:var(--dark);background:var(--s-yellow)}
.faq details{background:var(--white);border:2px solid var(--dark);border-radius:18px;padding:0 20px;margin-bottom:12px}
.faq summary{cursor:pointer;font-weight:700;padding:18px 0;list-style:none;display:flex;justify-content:space-between;gap:12px;align-items:center}
.faq summary::-webkit-details-marker{display:none}
.faq summary:after{content:"+";font-size:24px;font-weight:600;flex:none}
.faq details[open] summary:after{content:"–"}
.faq details p{padding-bottom:18px;color:var(--muted)}
.onb{max-width:560px;margin:40px auto;text-align:center}
.onb .art{width:200px;height:200px;margin:0 auto 24px;border-radius:40px;border:2px solid var(--dark);display:grid;place-items:center;box-shadow:var(--off)}
.dots{display:flex;gap:8px;justify-content:center;margin:20px 0}
.dots i{width:10px;height:10px;border-radius:999px;background:var(--border)}
.dots i.on{width:28px;background:var(--dark)}
#toasts{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center;width:min(92vw,440px);pointer-events:none}
.toast{background:var(--dark);color:#fff;border-radius:16px;padding:12px 16px;font-weight:600;font-size:14px;display:flex;gap:10px;align-items:center;box-shadow:0 10px 30px #302d3d40;animation:tin .25s ease-out}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
.fab{position:fixed;right:20px;bottom:20px;z-index:60;width:60px;height:60px;border-radius:50%;background:var(--tq);border:2px solid var(--dark);box-shadow:var(--off);display:grid;place-items:center;cursor:pointer}
.chat{position:fixed;right:20px;bottom:92px;z-index:61;width:min(380px,calc(100vw - 32px));height:min(540px,calc(100vh - 140px));background:var(--white);border:2px solid var(--dark);border-radius:var(--r-l);box-shadow:var(--off);display:none;flex-direction:column;overflow:hidden}
.chat.open{display:flex}
.chat header{background:var(--s-tq);border-bottom:2px solid var(--dark);padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.chat .msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:85%;padding:10px 13px;border-radius:16px;font-size:14px;line-height:1.5}
.msg.bot{background:var(--cream);border:2px solid var(--line);align-self:flex-start;border-bottom-left-radius:4px}
.msg.me{background:var(--dark);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.chat form{display:flex;gap:8px;padding:12px;border-top:2px dashed var(--border)}
.chat form .inp{min-height:44px}
.chat .quick{display:flex;gap:6px;overflow-x:auto;padding:0 12px 10px}
.chat .quick .chip{flex:none;min-height:36px;padding:5px 12px;font-size:13px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media(max-width:600px){
 .card{padding:18px}
 .btn{padding:0 18px}
 .flownav .btn{flex:1}
 .tbl{font-size:13px}
 .stack thead{display:none}.stack tr{display:grid;padding-block:10px;border-bottom:2px dashed var(--line)}.stack td{display:flow-root;border:0;padding:3px 14px;padding-inline-start:9em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:8.2em;margin-inline-start:-8.6em;white-space:normal;color:var(--muted);font-weight:600}.stack td:empty{display:none}.stack .num{text-align:start}
}

function qr(seed, size) {
  let h = 0;
  for (let i = 0; i < seed.length; i++) h = (h * 31 + seed.charCodeAt(i)) >>> 0;
  h = h || 7;
  const rnd = () => { h ^= h << 13; h >>>= 0; h ^= h >> 17; h ^= h << 5; h >>>= 0; return h / 4294967296; };
  const n = 25;
  const inF = (x, y) => { const f = (fx, fy) => x >= fx - 1 && x < fx + 8 && y >= fy - 1 && y < fy + 8; return f(0, 0) || f(n - 7, 0) || f(0, n - 7); };
  let d = '';
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) { if (inF(x, y)) continue; if (rnd() > 0.52) d += 'M' + x + ' ' + y + 'h1v1h-1z'; }
  const fp = (x, y) => 'M' + x + ' ' + y + 'h7v7h-7zM' + (x + 1) + ' ' + (y + 1) + 'v5h5v-5zM' + (x + 2) + ' ' + (y + 2) + 'h3v3h-3z';
  d += fp(0, 0) + fp(n - 7, 0) + fp(0, n - 7);
  return `<svg width="${size}" height="${size}" viewBox="-1 -1 27 27" role="img" aria-label="Kode QR contoh"><rect x="-1" y="-1" width="27" height="27" fill="#fff"/><path fill-rule="evenodd" d="${d}" fill="#302D3D"/></svg>`;
}

const FLOW = [['buat-unggah','Unggah'],['buat-material','Cek kain'],['buat-produk','Produk'],['buat-desain','Kustomisasi'],['buat-pratinjau','Pratinjau'],['buat-cerita','Cerita'],['buat-tag','Memory Tag'],['buat-penjemputan','Penjemputan'],['buat-surat','Persetujuan'],['buat-bayar','Pembayaran']];
function vFlow(m, h) {
  const i = FLOW.findIndex(f => f[0] === h), d = S.draft;
  if (i < 0) { go('buat-unggah'); return null; }
  if (i > d.reached) { go(FLOW[d.reached][0]); return null; }
  const stepper = `<nav class="stepper" aria-label="Langkah membuat ReCraft">${FLOW.map((f, j) => `<button class="st ${j === i ? 'cur' : j <= d.reached ? 'done' : ''}" ${j <= d.reached && j !== i ? `data-go="${f[0]}"` : 'tabindex="-1"'} ${j === i ? 'aria-current="step"' : ''}><b>${j < d.reached && j !== i ? '✓' : j + 1}</b>${f[1]}</button>`).join('')}</nav>`;
  const body = [fUpload, fMaterial, fProduct, fDesign, fPreview, fStory, fTag, fPickup, fAgree, fPay][i]();
  const showSide = i >= 2 && i !== 3;
  const nextLabel = i === 8 ? '' : i === 9 ? '' : `<button class="btn btn-pri" data-act="next">Lanjut ${ic('ArrowRight', 18)}</button>`;
  return `<section class="wrap flowhead"><div class="row sb wr"><p class="kick c-orange" style="margin:0">Buat ReCraft · Langkah ${i + 1} dari ${FLOW.length}</p><button class="linkbtn sm" data-act="cancelFlow">Batal</button></div>${stepper}
    <div class="flow ${showSide ? '' : 'full'}"><div><div class="card">${body}
      ${S.err ? `<div class="errbox mt16" role="alert">${ic('Help', 18)}${esc(S.err)}</div>` : ''}
      <div class="flownav">${i > 0 ? `<button class="btn btn-ghost" data-go="${FLOW[i - 1][0]}">${ic('ArrowLeft', 18)} Kembali</button>` : '<span></span>'}${nextLabel}</div></div></div>
      ${showSide ? `<aside class="side">${summaryCard(i)}</aside>` : ''}</div></section>`;
}

    <div class="grid g-2 mt24" style="align-items:start">

/* ---------- order engine ---------- */
function notify(o, text, icon, color, goTo) { S.notifs.push({ owner:o.email, text, meta:o.name, at:new Date(), read:false, icon, color, go:goTo || 'lacak-' + o.id }); }
function advance(o) {
  if (o.cancelled || o.step >= 7) return false;
  if (o.step === 5) {
    if (o.qc === 'revision') { o.qc = 'waiting'; o.revUsed = true; o.history.push({ s:-1, extra:true, label:'Foto hasil perbaikan dikirim', at:new Date() }); notify(o, 'Foto hasil perbaikan siap kamu setujui.', 'Check', 'pink'); return true; }
    if (o.qc !== 'approved') return false;
  }
  o.step++;
  o.history.push({ s:o.step, label:stepName(o, o.step), at:new Date() });
  if (o.step === 5) o.qc = 'waiting';
  const N = { 1:['Kain sudah dalam perjalanan ke studio.', 'Truck', 'blue'], 2:['Kainmu sudah diterima studio.', 'Box', 'tq'], 3:['Desain sudah dikonfirmasi crafter.', 'Check', 'purple'], 4:['ReCraft-mu sedang diproduksi.', 'Scissors', 'orange'], 5:['Foto hasil akhir siap kamu setujui.', 'Check', 'pink'], 6:['ReCraft-mu sudah dikirim.', 'Truck', 'blue'], 7:['ReCraft-mu sudah diterima.', 'Box', 'tq'] }[o.step];
  notify(o, N[0], N[1], N[2]);
  if (o.step === 7) {
    const st = S.stories.find(s => s.order === o.id);
    if (st && st.pending) { st.pending = false; notify(o, 'Ceritamu sudah masuk ke Cerita Saya.', 'Book', 'pink', 'cerita-' + st.id); }
  }

}
function placeOrder() {
  const d = S.draft, pr = priceOf(d), id = 'RC-2026-0' + (S.seq++), p = PROD[d.product];
  const o = { id, name:p.name + (d.story.title ? ' · ' + d.story.title : ''), product:d.product, customer:S.user.name, email:S.user.email, date:new Date(), total:pr.total, step:0, cancelled:false, qc:'none', revUsed:false, revNote:'',
    accent:d.accent, text:d.text.trim(), tag:d.tag, garment:d.garment, material:d.material, opts:Object.assign({}, d.opts), crafter:'Bu Ratna', before:d.photos[0] ? d.photos[0].src : GARMENTS[d.garment][1],
    pickup:{ method:d.pickup.method, date:d.pickup.method === 'jemput' ? d.pickup.date : addDays(TODAY, 1), slot:d.pickup.slot || SLOTS[0], address:d.pickup.address || S.user.address, note:d.pickup.note, courier:d.pickup.courier, kurir:'', resi:'' },

  o.due = addDays(o.date, d.product === 'boneka' || d.product === 'custom' ? 14 : 9);

function validateStep(i) {
  const d = S.draft;
  if (i === 0 && !d.photos.length) return 'Unggah minimal satu foto baju, atau pakai foto contoh.';
  if (i === 2 && fabricOf(d) < PROD[d.product].need) return 'Kain belum cukup untuk produk ini. Pilih produk lain atau tambah jumlah baju.';
  if (i === 3 && d.product === 'custom' && d.custom.trim().length < 15) return 'Ceritakan idemu minimal 15 karakter supaya crafter bisa memberi penawaran.';
  if (i === 5) { if (d.story.title.trim().length < 3) return 'Isi judul cerita (minimal 3 karakter).'; if (d.story.text.trim().length < 20) return 'Tulis ceritamu minimal 20 karakter.'; if (d.story.year && !/^(19|20)\d\d$/.test(d.story.year)) return 'Tahun harus 4 angka, misalnya 2024.'; }
  if (i === 7 && d.pickup.method === 'jemput') { if (!d.pickup.date) return 'Pilih tanggal penjemputan.'; if (!d.pickup.slot) return 'Pilih jam penjemputan.'; if (d.pickup.address.trim().length < 10) return 'Isi alamat penjemputan dengan lengkap.'; }
  if (i === 8 && !d.agree.signed) return 'Tanda tangani surat persetujuan dulu.';
  return '';
}

  c.addEventListener('pointerup', end); c.addEventListener('pointercancel', end); c.addEventListener('pointerleave', end);
}
function mountDrop() {
  const z = document.getElementById('drop'); if (!z) return;
  ['dragenter', 'dragover'].forEach(ev => z.addEventListener(ev, e => { e.preventDefault(); z.classList.add('over'); }));
  ['dragleave', 'drop'].forEach(ev => z.addEventListener(ev, e => { e.preventDefault(); z.classList.remove('over'); }));
  z.addEventListener('drop', e => addFiles(e.dataTransfer.files));
}

document.addEventListener('click', e => {
  const g = e.target.closest('[data-go]');
  if (g && !g.disabled) { e.preventDefault(); go(g.dataset.go); return; }
  const a = e.target.closest('[data-act]');
  if (a && !a.disabled && ACT[a.dataset.act]) { e.preventDefault(); ACT[a.dataset.act](a.dataset.arg, a, e); }
});
document.addEventListener('input', e => { const t = e.target; if (t.dataset && t.dataset.in && IN[t.dataset.in]) IN[t.dataset.in](t, e); });
document.addEventListener('change', e => { const t = e.target; if (t.dataset && t.dataset.ch && CH[t.dataset.ch]) CH[t.dataset.ch](t, e); });
document.addEventListener('submit', e => { const f = e.target; if (f.dataset && f.dataset.sub && SUB[f.dataset.sub]) { e.preventDefault(); SUB[f.dataset.sub](f); } });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.chat.open) { S.chat.open = false; renderChat(); } });
window.addEventListener('hashchange', () => render());
render();
}
</script>
